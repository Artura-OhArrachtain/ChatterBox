name: chatterbox
description: A Discord-inspired chat client built with Flutter.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_webrtc: ^1.6.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.3
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
