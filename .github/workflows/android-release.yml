name: Package Android app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages
        working-directory: client
        run: flutter pub get

      - name: Build Android APK
        working-directory: client
        env:
          CHATTERBOX_API_URL: ${{ vars.CHATTERBOX_API_URL }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$RELEASE_EVENT" == "push" ]]; then
            BUILD_NAME="${RELEASE_TAG#v}"
          else
            BUILD_NAME="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          flutter build apk --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define="CHATTERBOX_API=$CHATTERBOX_API_URL"

      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          cp client/build/app/outputs/flutter-apk/app-release.apk dist/ChatterBox-Android.apk

      - name: Attach APK to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/ChatterBox-Android.apk

      - name: Save APK as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ChatterBox-Android
          path: dist/ChatterBox-Android.apk
          if-no-files-found: error
          retention-days: 30
