name: Publish ChatterBox web app
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install Flutter packages
        working-directory: client
        run: flutter pub get

      - name: Validate deployment configuration
        env:
          CHATTERBOX_API_URL: ${{ vars.CHATTERBOX_API_URL }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
        run: |
          if [[ -z "$CHATTERBOX_API_URL" || "$CHATTERBOX_API_URL" != https://* ]]; then
            echo "Set CHATTERBOX_API_URL to the HTTPS URL of the deployed Go API."
            exit 1
          fi
          if [[ -z "$FIREBASE_API_KEY" || -z "$FIREBASE_PROJECT_ID" || -z "$FIREBASE_MESSAGING_SENDER_ID" || -z "$FIREBASE_WEB_APP_ID" ]]; then
            echo "Set FIREBASE_API_KEY, FIREBASE_PROJECT_ID, FIREBASE_MESSAGING_SENDER_ID, and FIREBASE_WEB_APP_ID as GitHub Actions repository variables."
            exit 1
          fi

      - name: Build Flutter web app
        working-directory: client
        env:
          CHATTERBOX_API_URL: ${{ vars.CHATTERBOX_API_URL }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          REPOSITORY_NAME="${REPOSITORY#*/}"
          if [[ "$REPOSITORY_NAME" == "$REPOSITORY_OWNER.github.io" ]]; then
            BASE_HREF="/"
          else
            BASE_HREF="/$REPOSITORY_NAME/"
          fi
          flutter build web --release \
            --base-href "$BASE_HREF" \
            --dart-define="CHATTERBOX_API=$CHATTERBOX_API_URL" \
            --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY" \
            --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
            --dart-define="FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define="FIREBASE_WEB_APP_ID=$FIREBASE_WEB_APP_ID" \
            --dart-define="FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN"

      - name: Create app download page
        working-directory: client
        run: |
          cat > build/web/downloads.html <<EOF
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="theme-color" content="#111318">
          <title>Install ChatterBox</title>
          <style>body{font:16px system-ui;background:#111318;color:#f4f4f6;max-width:620px;margin:12vh auto;padding:24px}a{color:#aeb9ff}.card{background:#191b22;border-radius:16px;padding:24px;margin:16px 0}h1{color:#fff}li{margin:10px 0}</style>
          <h1>Install ChatterBox</h1>
          <div class="card"><h2>Android</h2><p><a href="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/ChatterBox-Android.apk">Download the latest Android APK</a> from GitHub Releases.</p><ol><li>Open the downloaded APK on your phone.</li><li>If prompted, allow your browser or file manager to install unknown apps.</li><li>Tap Install, then open ChatterBox.</li></ol></div>
          <div class="card"><h2>iPhone and iPad</h2><p>Open ChatterBox in Safari, tap Share, then choose <b>Add to Home Screen</b> to install the web app. Native iOS distribution requires an Apple-signed build.</p></div>
          <p><a href="./">Open ChatterBox</a></p>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
