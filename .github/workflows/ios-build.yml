name: Build iOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages
        working-directory: client
        run: flutter pub get

      - name: Build iOS app without signing
        working-directory: client
        env:
          CHATTERBOX_API_URL: ${{ vars.CHATTERBOX_API_URL }}
        run: flutter build ios --release --no-codesign --dart-define="CHATTERBOX_API=$CHATTERBOX_API_URL"

      - name: Archive unsigned iOS app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            client/build/ios/iphoneos/Runner.app dist/ChatterBox-iOS-unsigned.zip

      - name: Save unsigned iOS app as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatterBox-iOS-unsigned
          path: dist/ChatterBox-iOS-unsigned.zip
          if-no-files-found: error
          retention-days: 30
